server:
  port: 8081

spring:
  application:
    name: fiap-bank-plataforma-credito
  datasource:
    url: jdbc:h2:mem:plataformacreditodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

core:
  bancario:
    url: ${CORE_BANCARIO_URL:http://localhost:8080/api/v1}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

app:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*

management:
  endpoints:
    web:
      exposure:
        include: health,info

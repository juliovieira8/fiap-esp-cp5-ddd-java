server:
  port: 8080

spring:
  application:
    name: fiap-bank-core-bancario
  datasource:
    url: jdbc:h2:mem:corebancariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
